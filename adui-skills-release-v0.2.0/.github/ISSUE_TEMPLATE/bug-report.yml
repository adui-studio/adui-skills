name: Bug 报告
about: 报告 ADui Skills Pack、Profile、脚本或 Workflow 的可复现问题
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要在公开 Issue 中粘贴 Token、密码或私有仓库敏感信息。
        English fallback: do not include secrets or private repository data.
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 v0.2.0 或 Commit SHA
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小复现步骤、命令和必要日志。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: OS、Node、包管理器、Agent 等
      placeholder: Windows 11 / Node 24 / pnpm / Codex
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认日志中不包含 Secret。
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
