name: Weekly Skills Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-skills-update
  cancel-in-progress: false

jobs:
  update:
    name: Check upstream Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate before update
        run: npm run validate

      - name: Check upstream revisions
        id: updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-updates.mjs \
            --write \
            --prune \
            --report "${RUNNER_TEMP}/adui-skills-update.md"

      - name: Validate refreshed lock
        if: steps.updates.outputs.changed == 'true'
        run: npm run validate

      - name: Prepare update branch
        if: steps.updates.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="chore/weekly-skills-update"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git checkout -B "$BRANCH"

          git add registry/skills.lock.json

          if git diff --cached --quiet; then
            echo "No lock changes to commit."
            exit 0
          fi

          git commit -m "chore(skills): refresh upstream lock"
          git push --force-with-lease origin "HEAD:${BRANCH}"

      - name: Create or update pull request
        if: steps.updates.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          REPORT_PATH: ${{ steps.updates.outputs.report_path }}
        shell: bash
        run: |
          set -euo pipefail

          if gh pr view "$BRANCH" --json number,url >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "chore(skills): weekly upstream update" \
              --body-file "$REPORT_PATH"

            gh pr view "$BRANCH" --json url --jq '.url'
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(skills): weekly upstream update" \
              --body-file "$REPORT_PATH"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Weekly Skills Update"
            echo
            echo "- Changed: \`${{ steps.updates.outputs.changed || 'false' }}\`"
            echo "- Checked: \`${{ steps.updates.outputs.checked || '0' }}\`"
            echo "- Updated: \`${{ steps.updates.outputs.updated_count || '0' }}\`"
            echo "- Baseline: \`${{ steps.updates.outputs.baseline_count || '0' }}\`"
            echo "- Removed: \`${{ steps.updates.outputs.removed_count || '0' }}\`"
            echo
            echo "Third-party Skill updates are never auto-merged."
          } >> "$GITHUB_STEP_SUMMARY"
