name: 每周精选 skills.sh 排行 Skill

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/weekly-ranking.yml'
      - 'config/skills-sh-ranking.json'
      - 'scripts/skills-sh-ranking.mjs'
      - 'scripts/update-ranking-display.mjs'
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-skills-ranking
  cancel-in-progress: false

jobs:
  ranking:
    name: 分类排行并生成 Pack 候选 PR
    runs-on: ubuntu-latest

    steps:
      - name: 检出主仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 运行前校验
        run: npm run validate

      - name: 生成 skills.sh 分类排行与候选
        id: ranking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(TZ=Asia/Shanghai date +%F)"
          REPORT="reports/skills-sh/${DATE}.md"
          LATEST="reports/skills-sh/latest.md"

          node scripts/skills-sh-ranking.mjs \
            --write \
            --report "$REPORT"

          cp "$REPORT" "$LATEST"
          cp pack/skills-sh-pack.json "${RUNNER_TEMP}/skills-sh-pack.json"

          node scripts/update-ranking-display.mjs \
            --report "$LATEST" \
            --readme README.md \
            --readme-en README.en.md

      - name: 运行测试
        run: npm test

      - name: 自动发布最新完整排行榜到 Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "::error::缺少 WIKI_TOKEN，无法自动发布排行榜到 GitHub Wiki。"
            exit 1
          fi

          WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          WIKI_DIR="$(mktemp -d)"

          git clone "$WIKI_URL" "$WIKI_DIR"
          cp reports/skills-sh/latest.md "$WIKI_DIR/Weekly-Skills-Ranking-Latest.md"

          cd "$WIKI_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Weekly-Skills-Ranking-Latest.md

          if git diff --cached --quiet; then
            echo "Wiki 最新排行榜无变化。"
            exit 0
          fi

          git commit -m "docs(rankings): 更新 skills.sh 每周分类排行"
          git push origin HEAD:master

      - name: 自动更新 README 与排行榜快照
        id: display
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md README.en.md reports/skills-sh

          if git diff --cached --quiet; then
            echo "README 与排行榜快照无变化。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(rankings): 刷新 skills.sh 每周排行榜"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 Pack 候选分支
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="chore/weekly-skills-ranking"
          PACK_STATE="${RUNNER_TEMP}/skills-sh-pack.json"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git checkout -B "$BRANCH" origin/main
          cp "$PACK_STATE" pack/skills-sh-pack.json
          git add pack/skills-sh-pack.json

          if git diff --cached --quiet; then
            echo "没有新的 Pack 候选状态需要提交。"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(pack): 追加 skills.sh 每周优选候选"
          git push --force-with-lease origin "HEAD:${BRANCH}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: 创建或更新候选 Pull Request
        if: steps.branch.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          REPORT_PATH: ${{ steps.ranking.outputs.report_path }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="chore(pack): 追加 skills.sh 每周优选候选"
          PR_NUMBER="$(gh pr list \
            --base main \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title "$TITLE" \
              --body-file "$REPORT_PATH"
            gh pr view "$PR_NUMBER" --json url --jq '.url'
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$REPORT_PATH"
          fi

      - name: 写入 Actions 摘要
        if: always()
        env:
          REPORT_PATH: ${{ steps.ranking.outputs.report_path }}
        shell: bash
        run: |
          {
            echo "## skills.sh 每周分类排行"
            echo
            echo "- Pack：https://www.skills.sh/p/DCh7RQegkqCXcXn8"
            echo "- 当前读取 Pack Skill 数：\`${{ steps.ranking.outputs.pack_count || '0' }}\`"
            echo "- 本周新增候选：\`${{ steps.ranking.outputs.selected_count || '0' }}\`"
            echo "- README / 排行快照自动刷新：\`${{ steps.display.outputs.changed || 'false' }}\`"
            echo "- Pack 候选状态变化：\`${{ steps.ranking.outputs.changed || 'false' }}\`"
            echo "- README：每个分类第 1 名，直接更新 main"
            echo "- Wiki：每个分类 Top 5，直接自动发布"
            echo "- 仓库快照：\`reports/skills-sh/latest.md\`"
            echo
            echo "排行榜展示每周自动更新；Pack 候选清单只追加，并继续通过 PR 人工 Review，永远不会自动合并。"
            echo
            echo "skills.sh 暂无公开 Pack 写入 API，最终加入 Pack 需要在 Pack 管理页确认。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${REPORT_PATH:-}" ] && [ -f "$REPORT_PATH" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi
