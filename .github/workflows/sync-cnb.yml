name: 同步 GitHub 到 CNB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    name: 同步主分支与版本标签到 CNB
    runs-on: ubuntu-latest

    steps:
      - name: 检出 GitHub 主仓库
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 检查 CNB_TOKEN
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::未配置 CNB_TOKEN。"
            exit 1
          fi
          echo "CNB_TOKEN 已配置。"

      - name: 配置 CNB HTTPS 认证
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/cnb-askpass.sh <<'SCRIPT'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) echo "cnb" ;;
            *Password*) echo "$CNB_TOKEN" ;;
            *) echo "" ;;
          esac
          SCRIPT

          chmod 700 /tmp/cnb-askpass.sh

      - name: 配置 CNB Remote
        shell: bash
        run: |
          set -euo pipefail
          git remote remove cnb 2>/dev/null || true
          git remote add cnb "https://cnb.cool/adui-studio/adui-skills"
          echo "CNB Remote 已配置。"

      - name: 同步 main 分支
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_ASKPASS: /tmp/cnb-askpass.sh
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git push cnb HEAD:refs/heads/main
          echo "main 分支同步完成。"

      - name: 同步版本标签
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_ASKPASS: /tmp/cnb-askpass.sh
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git push cnb --tags
          echo "版本标签同步完成。"

      - name: 写入同步摘要
        shell: bash
        run: |
          {
            echo "## GitHub → CNB 同步"
            echo
            echo "- GitHub：\`${GITHUB_REPOSITORY}\`"
            echo "- CNB：\`adui-studio/adui-skills\`"
            echo "- 分支：\`main\`"
            echo "- Commit：\`${GITHUB_SHA}\`"
            echo
            echo "✅ 同步完成。"
            echo
            echo "English fallback: GitHub primary repository was synchronized to the CNB China mirror."
          } >> "$GITHUB_STEP_SUMMARY"
