name: Sync GitHub to CNB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    name: Sync GitHub to CNB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          # 始终同步 GitHub main，而不是使用 detached HEAD
          ref: main

          # 获取完整 Git 历史
          fetch-depth: 0

          # 获取所有 Tags
          fetch-tags: true

          # Checkout 完成后不保留 GitHub Token
          # 防止和后面的 CNB 凭据混用
          persist-credentials: false

      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          git remote -v

          echo
          echo "Current branch:"
          git branch --show-current

          echo
          echo "Current commit:"
          git log -1 --oneline

          echo
          echo "Tags:"
          git tag --list

      - name: Check CNB token
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::CNB_TOKEN is empty or not configured."
            exit 1
          fi

          echo "CNB_TOKEN is configured."

      - name: Configure CNB authentication
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/cnb-askpass.sh <<'EOF'
          #!/usr/bin/env sh

          case "$1" in
            *Username*)
              echo "cnb"
              ;;
            *Password*)
              echo "$CNB_TOKEN"
              ;;
            *)
              echo ""
              ;;
          esac
          EOF

          chmod 700 /tmp/cnb-askpass.sh

      - name: Configure CNB remote
        shell: bash
        run: |
          set -euo pipefail

          git remote remove cnb 2>/dev/null || true

          git remote add cnb \
            "https://cnb.cool/adui-studio/adui-skills"

          echo "CNB remote:"
          git remote get-url cnb

      - name: Sync main branch to CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_ASKPASS: /tmp/cnb-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          echo "Pushing main branch to CNB..."

          git push \
            cnb \
            HEAD:refs/heads/main

          echo "Main branch synchronized successfully."

      - name: Sync tags to CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_ASKPASS: /tmp/cnb-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          echo "Pushing tags to CNB..."

          git push cnb --tags

          echo "Tags synchronized successfully."

      - name: Sync summary
        shell: bash
        run: |
          {
            echo "## CNB Sync"
            echo
            echo "- GitHub: \`${GITHUB_REPOSITORY}\`"
            echo "- Branch: \`main\`"
            echo "- CNB: \`adui-studio/adui-skills\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "✅ GitHub → CNB synchronization completed."
          } >> "$GITHUB_STEP_SUMMARY"
