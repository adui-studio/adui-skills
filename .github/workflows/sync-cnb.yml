name: Sync GitHub to CNB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    name: Sync GitHub to CNB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch main branch and tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            --tags \
            --force

      - name: Configure CNB credentials
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::CNB_TOKEN is not configured."
            exit 1
          fi

          cat > /tmp/cnb-askpass.sh <<'EOF'
          #!/usr/bin/env sh

          case "$1" in
            *Username*)
              echo "cnb"
              ;;
            *Password*)
              echo "$CNB_TOKEN"
              ;;
          esac
          EOF

          chmod 700 /tmp/cnb-askpass.sh

      - name: Sync main branch and tags
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_ASKPASS: /tmp/cnb-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          CNB_REPOSITORY="https://cnb.cool/adui-studio/adui-skills"

          echo "Syncing main branch..."

          git push \
            "$CNB_REPOSITORY" \
            "refs/remotes/origin/main:refs/heads/main"

          echo "Syncing tags..."

          git push \
            "$CNB_REPOSITORY" \
            "refs/tags/*:refs/tags/*"

          echo "GitHub -> CNB synchronization completed."
