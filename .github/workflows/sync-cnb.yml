name: Sync to CNB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    name: Sync GitHub to CNB
    runs-on: ubuntu-latest

    steps:
      - name: Clone GitHub repository
        shell: bash
        run: |
          set -euo pipefail

          git clone --bare \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            repository.git

      - name: Configure CNB credentials
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          cat > /tmp/cnb-askpass.sh <<'EOF'
          #!/usr/bin/env sh

          case "$1" in
            *Username*)
              echo "cnb"
              ;;
            *Password*)
              echo "$CNB_TOKEN"
              ;;
          esac
          EOF

          chmod 700 /tmp/cnb-askpass.sh

      - name: Sync main branch and tags
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GIT_ASKPASS: /tmp/cnb-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        working-directory: repository.git
        run: |
          set -euo pipefail

          CNB_REPOSITORY="https://cnb.cool/adui-studio/adui-skills"

          git push \
            "$CNB_REPOSITORY" \
            "refs/heads/main:refs/heads/main"

          git push \
            "$CNB_REPOSITORY" \
            --tags