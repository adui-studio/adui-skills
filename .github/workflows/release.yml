name: 发布 ADui Skills Pack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签，例如 v0.2.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: 校验并发布 GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出版本标签
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 配置 Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 确定发布标签
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "notes=releases/${TAG}.md" >> "$GITHUB_OUTPUT"

          TITLE=$(node -e "const m=require('./manifest.json'); console.log(m.name)")
          CHANNEL=$(node -e "const m=require('./manifest.json'); console.log(m.releaseChannel || 'stable')")
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: 确认标签指向当前 Commit
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse "refs/tags/${TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::标签 ${TAG} 未指向当前检出的 Commit。"
            exit 1
          fi
          echo "标签 ${TAG} → ${HEAD_COMMIT}"

      - name: 执行仓库校验
        run: npm run validate

      - name: 运行自动化测试
        run: npm test

      - name: 执行发布前检查
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: npm run release:check -- --tag "$TAG"

      - name: 构建 Release 产物
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: npm run release:package -- --tag "$TAG" --out-dir dist

      - name: 为 Release 产物生成 GitHub Artifact Attestation
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          set -euo pipefail

          EXTRA_FLAGS=()
          if [ "$CHANNEL" != "stable" ]; then
            EXTRA_FLAGS+=(--prerelease --latest=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新说明并重新上传资产。"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --verify-tag \
              "${EXTRA_FLAGS[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --verify-tag \
              "${EXTRA_FLAGS[@]}"
          fi

      - name: 写入发布摘要
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          {
            echo "## ADui Skills Pack 发布"
            echo
            echo "- 标签：\`${TAG:-unknown}\`"
            echo "- 发布通道：\`${CHANNEL:-unknown}\`"
            echo "- Commit：\`${GITHUB_SHA}\`"
            echo "- Release：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG:-unknown}"
            echo
            echo "正式发布前已执行 Registry/Profile 校验、自动化测试和 Folder Hash Lock 完整性检查。"
            echo
            echo "English fallback: the tagged release was validated, packaged and published with integrity metadata."
          } >> "$GITHUB_STEP_SUMMARY"
